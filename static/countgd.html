<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CountGD Chip Counter</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; padding: 20px; }
h1 { font-size: 1.4em; margin-bottom: 16px; color: #ffd964; }
.container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 320px; gap: 20px; }
.main { display: flex; flex-direction: column; gap: 16px; }
.sidebar { display: flex; flex-direction: column; gap: 16px; }

.card { background: #16213e; border-radius: 8px; padding: 16px; border: 1px solid #0f3460; }
.card h2 { font-size: 0.9em; color: #ffd964; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }

.controls-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.controls-row input[type="text"] { background: #0f3460; border: 1px solid #1a4080; color: #eee; padding: 8px 12px; border-radius: 4px; font-size: 0.9em; flex: 1; min-width: 200px; }
.controls-row input[type="file"] { color: #aaa; font-size: 0.85em; }

.btn { padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 0.9em; transition: all 0.2s; }
.btn-count { background: #ffd964; color: #1a1a2e; }
.btn-count:hover { background: #eec84a; }
.btn-count:disabled { background: #333; color: #666; cursor: not-allowed; }

.canvas-wrapper { position: relative; background: #000; border-radius: 8px; overflow: hidden; min-height: 400px; display: flex; align-items: center; justify-content: center; }
.canvas-wrapper img { max-width: 100%; max-height: 600px; object-fit: contain; }
.canvas-placeholder { color: #666; font-size: 1.1em; }

.results-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.result-item { text-align: center; padding: 12px 8px; background: #0f3460; border-radius: 4px; }
.result-item .value { font-size: 1.6em; font-weight: 700; color: #ffd964; }
.result-item .label { font-size: 0.7em; color: #aaa; margin-top: 4px; }

.slider-group { margin-bottom: 14px; }
.slider-label { display: flex; justify-content: space-between; font-size: 0.8em; margin-bottom: 4px; }
.slider-label span:first-child { color: #ccc; }
.slider-label span:last-child { color: #ffd964; font-weight: 600; }
input[type="range"] { width: 100%; height: 4px; -webkit-appearance: none; background: #0f3460; border-radius: 2px; outline: none; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #ffd964; cursor: pointer; }

.tabs { display: flex; gap: 0; margin-bottom: 12px; }
.tab { padding: 8px 16px; cursor: pointer; background: #0f3460; border: 1px solid #1a4080; color: #aaa; font-size: 0.85em; transition: all 0.2s; }
.tab:first-child { border-radius: 4px 0 0 4px; }
.tab:last-child { border-radius: 0 4px 4px 0; }
.tab.active { background: #ffd964; color: #1a1a2e; font-weight: 600; border-color: #ffd964; }

.mode-panel { display: none; }
.mode-panel.active { display: block; }

.stacks-input { width: 100%; min-height: 80px; background: #0f3460; border: 1px solid #1a4080; color: #eee; padding: 8px; border-radius: 4px; font-size: 0.8em; font-family: monospace; resize: vertical; }

.history-list { max-height: 300px; overflow-y: auto; }
.history-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #0f3460; font-size: 0.8em; }
.history-item:hover { background: #0f3460; }
.history-item .count { color: #ffd964; font-weight: 700; }

.status { font-size: 0.8em; color: #aaa; margin-top: 8px; }

@media (max-width: 900px) {
  .container { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<h1>CountGD Chip Counter</h1>

<div class="container">
  <div class="main">
    <div class="card">
      <div class="tabs">
        <div class="tab active" data-mode="single">Single Image</div>
        <div class="tab" data-mode="stacks">SAM3 Stacks</div>
        <div class="tab" data-mode="video">Video Feed</div>
      </div>

      <!-- Single Image Mode -->
      <div class="mode-panel active" id="panel-single">
        <div class="controls-row">
          <input type="file" id="imageInput" accept="image/*">
          <input type="text" id="promptInput" value="poker chip" placeholder="Prompt...">
          <button class="btn btn-count" id="countBtn">Count</button>
        </div>
      </div>

      <!-- SAM3 Stacks Mode -->
      <div class="mode-panel" id="panel-stacks">
        <div class="controls-row" style="margin-bottom: 10px;">
          <input type="file" id="stacksImageInput" accept="image/*">
          <input type="text" id="stacksPromptInput" value="poker chip" placeholder="Prompt...">
          <button class="btn btn-count" id="countStacksBtn">Count Stacks</button>
        </div>
        <textarea class="stacks-input" id="stacksBboxInput" placeholder="Paste SAM3 bounding boxes as JSON array:&#10;[[x0,y0,x1,y1], [x0,y0,x1,y1], ...]"></textarea>
      </div>

      <!-- Video Feed Mode -->
      <div class="mode-panel" id="panel-video">
        <div class="controls-row">
          <input type="text" id="videoPromptInput" value="poker chip" placeholder="Prompt...">
          <input type="text" id="sam3UrlInput" placeholder="SAM3 server URL (optional)" style="min-width: 250px;">
          <button class="btn btn-count" id="videoStartBtn">Start</button>
          <button class="btn" id="videoStopBtn" style="background:#ff6b6b;color:#fff;display:none">Stop</button>
        </div>
        <p class="status" id="videoStatus"></p>
      </div>
    </div>

    <div class="card">
      <div class="canvas-wrapper">
        <img id="resultImg" style="display:none">
        <div class="canvas-placeholder" id="placeholder">Upload an image to start counting</div>
      </div>
    </div>

    <div class="card">
      <h2>Results</h2>
      <div class="results-grid">
        <div class="result-item"><div class="value" id="resCount">-</div><div class="label">Total Count</div></div>
        <div class="result-item"><div class="value" id="resStacks">-</div><div class="label">Stacks</div></div>
        <div class="result-item"><div class="value" id="resTime">-</div><div class="label">Time (ms)</div></div>
      </div>
    </div>
  </div>

  <div class="sidebar">
    <div class="card">
      <h2>Settings</h2>
      <div class="slider-group">
        <div class="slider-label"><span>Box Threshold</span><span id="val_box_threshold">0.23</span></div>
        <input type="range" id="sl_box_threshold" min="0.05" max="0.60" step="0.01" value="0.23">
      </div>
    </div>

    <div class="card">
      <h2>History</h2>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>
</div>

<script>
let currentMode = 'single';
let ws = null;
const history = [];

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.mode-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    currentMode = tab.dataset.mode;
    document.getElementById(`panel-${currentMode}`).classList.add('active');
  });
});

// Slider
const slBox = document.getElementById('sl_box_threshold');
slBox.addEventListener('input', () => {
  document.getElementById('val_box_threshold').textContent = parseFloat(slBox.value).toFixed(2);
});

// Single image count
document.getElementById('countBtn').addEventListener('click', async () => {
  const fileInput = document.getElementById('imageInput');
  if (!fileInput.files[0]) { alert('Select an image first'); return; }

  const btn = document.getElementById('countBtn');
  btn.disabled = true;
  btn.textContent = 'Counting...';

  const formData = new FormData();
  formData.append('file', fileInput.files[0]);
  formData.append('prompt', document.getElementById('promptInput').value || 'poker chip');
  formData.append('box_threshold', slBox.value);

  try {
    const resp = await fetch('/api/count', { method: 'POST', body: formData });
    const data = await resp.json();
    showResult(data);
    addHistory('single', data);
  } catch (e) {
    alert('Error: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Count';
  }
});

// Stacks count
document.getElementById('countStacksBtn').addEventListener('click', async () => {
  const fileInput = document.getElementById('stacksImageInput');
  if (!fileInput.files[0]) { alert('Select an image first'); return; }

  const bboxText = document.getElementById('stacksBboxInput').value.trim();
  let stacks;
  try {
    stacks = JSON.parse(bboxText);
  } catch (e) {
    alert('Invalid JSON for bounding boxes');
    return;
  }

  const btn = document.getElementById('countStacksBtn');
  btn.disabled = true;
  btn.textContent = 'Counting...';

  const reader = new FileReader();
  reader.onload = async () => {
    const b64 = reader.result.split(',')[1];
    try {
      const resp = await fetch('/api/count-stacks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          image_b64: b64,
          stacks: stacks,
          prompt: document.getElementById('stacksPromptInput').value || 'poker chip',
          box_threshold: parseFloat(slBox.value),
        }),
      });
      const data = await resp.json();
      showStacksResult(data);
      addHistory('stacks', data);
    } catch (e) {
      alert('Error: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Count Stacks';
    }
  };
  reader.readAsDataURL(fileInput.files[0]);
});

// Video mode
document.getElementById('videoStartBtn').addEventListener('click', () => {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/count-video`);
  ws.onopen = () => {
    document.getElementById('videoStartBtn').style.display = 'none';
    document.getElementById('videoStopBtn').style.display = 'inline-block';
    document.getElementById('videoStatus').textContent = 'Connected. Waiting for frames...';
  };
  ws.onmessage = (evt) => {
    const data = JSON.parse(evt.data);
    if (data.type === 'result') {
      showResult(data);
    } else if (data.type === 'stacks_result') {
      showStacksResult(data);
    } else if (data.type === 'error') {
      document.getElementById('videoStatus').textContent = 'Error: ' + data.message;
    }
  };
  ws.onclose = () => {
    document.getElementById('videoStartBtn').style.display = 'inline-block';
    document.getElementById('videoStopBtn').style.display = 'none';
    document.getElementById('videoStatus').textContent = 'Disconnected';
  };
});

document.getElementById('videoStopBtn').addEventListener('click', () => {
  if (ws) { ws.send(JSON.stringify({ type: 'stop' })); ws.close(); }
});

function showResult(data) {
  document.getElementById('placeholder').style.display = 'none';
  const img = document.getElementById('resultImg');
  img.style.display = 'block';
  if (data.overlay_b64) {
    img.src = 'data:image/jpeg;base64,' + data.overlay_b64;
  }
  document.getElementById('resCount').textContent = data.count || 0;
  document.getElementById('resStacks').textContent = '-';
  document.getElementById('resTime').textContent = data.elapsed_ms || '-';
}

function showStacksResult(data) {
  document.getElementById('placeholder').style.display = 'none';
  const img = document.getElementById('resultImg');
  img.style.display = 'block';
  if (data.overlay_b64) {
    img.src = 'data:image/jpeg;base64,' + data.overlay_b64;
  }
  document.getElementById('resCount').textContent = data.total_chips || 0;
  document.getElementById('resStacks').textContent = (data.stacks || []).length;
  document.getElementById('resTime').textContent = data.elapsed_ms || '-';
}

function addHistory(mode, data) {
  const item = {
    mode,
    count: data.total_chips || data.count || 0,
    time: data.elapsed_ms || 0,
    timestamp: new Date().toLocaleTimeString(),
  };
  history.unshift(item);
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById('historyList');
  list.innerHTML = history.slice(0, 20).map(h => `
    <div class="history-item">
      <span>${h.timestamp} [${h.mode}]</span>
      <span class="count">${h.count} chips</span>
      <span>${h.time}ms</span>
    </div>
  `).join('');
}
</script>
</body>
</html>
